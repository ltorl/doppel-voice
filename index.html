<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doppel</title>
<meta name="description" content="Free, easy, and local voice cloning/creation with Chatterbox-Turbo, running entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='12' cy='16' r='9' fill='%236d5efc'/><circle cx='20' cy='16' r='9' fill='%2322c3a6' fill-opacity='.8'/></svg>">
<style>
:root {
  --bg: #f7f6f3;
  --side: #efede8;
  --surface: #ffffff;
  --surface-2: #f3f1ec;
  --border: #e3e0d9;
  --text: #1d1b18;
  --muted: #6b675f;
  --accent: #5b4cf0;
  --accent-2: #12a58c;
  --accent-soft: #5b4cf01a;
  --accent-ink: #ffffff;
  --danger: #d0402b;
  --warn: #b7791f;
  --focus: #5b4cf055;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 24px rgba(0,0,0,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113; --side: #0c0c0e; --surface: #19191d; --surface-2: #212127; --border: #2c2c34;
    --text: #ecebe8; --muted: #9a98a3; --accent: #8a7dff; --accent-2: #2fd4b5; --accent-soft: #8a7dff1f;
    --accent-ink: #0f0f12; --danger: #ff6b55; --warn: #e0a84a; --focus: #8a7dff55;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111113; --side: #0c0c0e; --surface: #19191d; --surface-2: #212127; --border: #2c2c34;
  --text: #ecebe8; --muted: #9a98a3; --accent: #8a7dff; --accent-2: #2fd4b5; --accent-soft: #8a7dff1f;
  --accent-ink: #0f0f12; --danger: #ff6b55; --warn: #e0a84a; --focus: #8a7dff55;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
svg.i { width: 16px; height: 16px; flex: none; }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); height: 100vh; }
.side {
  background: var(--side); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0; padding: 18px 14px 14px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 18px; text-decoration: none; color: inherit; }
.brand svg { width: 34px; height: 34px; }
.brand b { font-size: 21px; letter-spacing: -.02em; display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: 12px; }
.side-actions { display: flex; gap: 6px; }
.side-label { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 18px 8px 6px; display: flex; justify-content: space-between; }
.vlist { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 2px; margin: 0 -4px; padding: 0 4px; }
.vitem {
  display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px;
  text-decoration: none; color: inherit; position: relative;
}
.vitem:hover { background: var(--surface-2); }
.vitem[aria-current="page"] { background: var(--surface); box-shadow: var(--shadow); }
.vitem .meta { min-width: 0; flex: 1; }
.vitem b { display: block; font-size: 14px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vitem small { display: block; color: var(--muted); font-size: 12px; }
.vitem .busy { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; }
.empty-side { color: var(--muted); font-size: 13px; padding: 6px 8px; }
.av {
  width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center;
  color: #fff; font-weight: 650; font-size: 13px; text-shadow: 0 1px 2px rgba(0,0,0,.25);
}
.av.lg { width: 52px; height: 52px; font-size: 20px; }

.quality { position: relative; display: inline-flex; align-items: center; gap: 4px; padding: 6px 8px 6px 10px; font-size: 13px; font-weight: 550; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; }
.quality:hover { border-color: var(--muted); }
.quality svg { width: 12px; height: 12px; color: var(--muted); }
.quality select { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; padding: 0; }
.quality:has(select:disabled) { opacity: .45; cursor: not-allowed; }
.quality:has(select:focus-visible) { outline: 3px solid var(--focus); outline-offset: 1px; }
.main { overflow: auto; min-width: 0; }
.view { max-width: 1180px; margin: 0 auto; padding: 32px 32px 64px; }
.topbar { display: none; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;
  border-radius: 10px; padding: 9px 15px; font-weight: 550; font-size: 14px; white-space: nowrap;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); text-decoration: none;
}
.btn:hover:not(:disabled) { border-color: color-mix(in srgb, var(--muted) 60%, var(--border)); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn.icon { padding: 8px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; padding: 4px 10px; font-size: 13px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
.chip:hover { border-color: var(--muted); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
select, input[type=number], input[type=text], textarea.input {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%;
}
.bar { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .2s; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1 1 auto; }
.note { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--warn); padding: 2px 10px; margin: 0; }
@keyframes pulse { 50% { opacity: .3; } }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }

/* ---------- headers ---------- */
.view-head { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.view-head h1 { font-size: 28px; letter-spacing: -.02em; margin: 0; line-height: 1.15; }
.view-head .sub { color: var(--muted); margin: 4px 0 0; }
.name-input {
  font-size: 28px; font-weight: 700; letter-spacing: -.02em; border: 1px solid transparent; background: transparent;
  border-radius: 8px; padding: 0 6px; margin-left: -7px; width: 100%; max-width: 520px;
}
.name-input:hover { border-color: var(--border); }
.name-input:focus { border-color: var(--accent); outline: none; background: var(--surface); }

/* ---------- create view ---------- */
.create-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
.card + .card { margin-top: 16px; }
.card h2 { font-size: 15px; margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
.card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 16px 0 8px; }
.card h3:first-of-type { margin-top: 0; }
.num { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; background: var(--accent-soft); color: var(--accent); }
.bases { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; }
.base {
  display: flex; align-items: center; gap: 10px; text-align: left; padding: 9px 10px; cursor: pointer;
  background: var(--surface-2); border: 1.5px solid transparent; border-radius: 12px; min-width: 0;
}
.base:hover { border-color: var(--border); }
.base[aria-pressed="true"] { border-color: var(--accent); background: var(--surface); }
.base .t { min-width: 0; }
.base b { display: block; font-size: 14px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.base small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.base.dashed { background: transparent; border: 1.5px dashed var(--border); }
.base.dashed .av { background: var(--surface-2); color: var(--muted); text-shadow: none; }
.base.recording .av { background: var(--danger); color: #fff; animation: pulse 1s infinite; }
.base.over { border-color: var(--accent); }
.sliders { display: grid; grid-template-columns: 90px 1fr 60px; gap: 12px 14px; align-items: center; font-size: 13.5px; }
.sliders label { color: var(--muted); }
.sliders input { width: 100%; accent-color: var(--accent); }
.sliders output { font-variant-numeric: tabular-nums; text-align: right; }
.sliders h3 { grid-column: 1 / -1; margin: 6px 0 -4px !important; }
.sliders h3:first-child { margin-top: 0 !important; }
.preview { position: sticky; top: 24px; }
.preview audio { width: 100%; height: 40px; }
.preview .sect { padding: 14px 0; border-top: 1px solid var(--border); }
.preview .sect:first-of-type { border-top: 0; padding-top: 0; }
.seg { display: inline-flex; gap: 4px; padding: 4px; margin: -4px 0 20px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
.seg button { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; }
.seg button:hover { color: var(--text); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.req { font-size: 11px; color: var(--accent); margin-left: 2px; }

/* ---------- studio ---------- */
.studio {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow);
  min-height: min(620px, calc(100vh - 200px));
}
.pane { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
.pane + .pane { border-left: 1px solid var(--border); background: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); border-radius: 0 18px 18px 0; }
.pane-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.script {
  flex: 1; min-height: 240px; border: 0; background: transparent; resize: none; padding: 0;
  font-size: 18px; line-height: 1.6; outline: none;
}
.script::placeholder { color: var(--muted); opacity: .7; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.pane-foot { display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); position: relative; flex-wrap: wrap; }
.settings { position: relative; }
.settings summary { list-style: none; }
.settings summary::-webkit-details-marker { display: none; }
.pop {
  position: absolute; bottom: calc(100% + 8px); left: 0; width: 300px; z-index: 20;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.pop p { grid-column: 1 / -1; margin: 0; }
.kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); }

.progress { display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.empty-out { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 30px; }
.empty-out svg { width: 120px; height: 48px; opacity: .5; margin-bottom: 8px; }
.hero { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.hero .wave-row { display: flex; align-items: center; gap: 12px; }
.play {
  width: 44px; height: 44px; border-radius: 50%; flex: none; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
}
.play svg { width: 18px; height: 18px; }
.play.sm { width: 32px; height: 32px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.play.sm svg { width: 13px; height: 13px; }
canvas.wave { width: 100%; height: 64px; display: block; cursor: pointer; }
.hero p { margin: 0; font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.takes { display: flex; flex-direction: column; gap: 4px; overflow: auto; min-height: 0; }
.take { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; }
.take:hover { background: var(--surface); }
.take .txt { flex: 1; min-width: 0; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- toast ---------- */
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 100; max-width: calc(100vw - 32px); }
.toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 13.5px; box-shadow: var(--shadow); max-width: 380px; }
.toast.err { background: var(--danger); color: #fff; }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .create-grid { grid-template-columns: 1fr; }
  .preview { position: static; }
}
@media (max-width: 960px) {
  .studio { grid-template-columns: 1fr; }
  .pane + .pane { border-left: 0; border-top: 1px solid var(--border); border-radius: 0 0 18px 18px; }
  .script { min-height: 180px; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: 284px; z-index: 50; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  body.nav-open .side { transform: none; }
  body.nav-open .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: block; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--side); position: sticky; top: 0; z-index: 10; }
  .topbar b { font-size: 18px; }
  .view { padding: 20px 16px 48px; }
  .view-head h1, .name-input { font-size: 23px; }
  .sliders { grid-template-columns: 76px 1fr 54px; }
  .view-head > .av.lg { display: none; }
}
@media (hover: none) { .kbd { display: none; } }
.scrim { display: none; }
/* ---------- create tile (modal) ---------- */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: start center; padding: 40px 24px; overflow: auto; }
.modal-scrim { position: fixed; inset: 0; background: rgba(10,10,14,.42); backdrop-filter: blur(3px); animation: fade .15s ease-out; }
.modal-tile {
  position: relative; width: min(1120px, 100%); background: var(--bg); border: 1px solid var(--border);
  border-radius: 22px; padding: 28px; box-shadow: 0 24px 80px rgba(0,0,0,.28); animation: rise .2s ease-out;
}
.modal-tile .view-head { margin-bottom: 20px; }
.modal-close { position: absolute; top: 16px; right: 16px; }
.modal-tile .create-grid { grid-template-columns: minmax(0, 1fr) 340px; }
body.modal-open { overflow: hidden; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } }
@media (max-width: 1000px) { .modal-tile .create-grid { grid-template-columns: 1fr; } .modal-tile .preview { position: static; } }
@media (max-width: 820px) {
  .modal { padding: 0; }
  .modal-tile { border-radius: 0; min-height: 100%; padding: 20px 16px 40px; border: 0; }
}
/* ---------- home ---------- */
.home { min-height: calc(100vh - 160px); display: grid; place-items: center; }
.home-tile {
  width: min(560px, 100%); text-align: center; padding: 44px 32px; border-radius: 22px; cursor: pointer;
  background: var(--surface); border: 1.5px dashed var(--border); box-shadow: var(--shadow);
  transition: transform .15s, border-color .15s, box-shadow .15s; display: block; color: inherit; text-decoration: none;
}
.home-tile:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 14px 40px rgba(0,0,0,.12); }
.home-tile .plus { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.home-tile .plus svg { width: 28px; height: 28px; }
.home-tile h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 6px; }
.home-tile p { color: var(--muted); margin: 0 auto; max-width: 420px; }
.steps { display: flex; justify-content: center; gap: 18px; margin-top: 24px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.steps > span { display: inline-flex; align-items: center; gap: 6px; }
#newVoiceBtn { transition: transform .15s, box-shadow .15s; }
#newVoiceBtn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent); }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="#/">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="15" cy="20" r="11" fill="var(--accent)"/>
        <circle cx="25" cy="20" r="11" fill="var(--accent-2)" fill-opacity=".8"/>
        <path d="M11 20h2M15 15v10M19 17v6M23 13v14M27 16v8M31 19v2" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span><b>Doppel</b><small>local voice studio</small></span>
    </a>
    <div class="side-actions">
      <a class="btn primary grow" href="#/create" id="newVoiceBtn"><svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>Create new voice</a>
      <button class="btn icon" id="importBtn" title="Import a .doppel.json voice or an audio clip" aria-label="Import voice"><svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10V2M4.5 5.5 8 2l3.5 3.5M2.5 13.5h11"/></svg></button>
      <input type="file" id="importInput" accept=".json,application/json,audio/*,video/*" hidden>
    </div>
    <div class="side-label"><span>Your voices</span><span id="voiceCount"></span></div>
    <nav class="vlist" id="vlist" aria-label="Saved voices"></nav>

  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="main">
    <div class="topbar">
      <button class="btn icon ghost" id="menuBtn" aria-label="Open menu"><svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
      <b>Doppel</b>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="modal" id="createModal" hidden>
  <div class="modal-scrim" id="modalScrim"></div>
  <div class="modal-tile" role="dialog" aria-modal="true" aria-label="Create a voice">
    <button class="btn icon ghost modal-close" id="modalClose" aria-label="Close" title="Close (Esc)"><svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    <div id="createBody"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module">
import * as ort from 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort.webgpu.min.mjs';
import { AutoTokenizer } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.1/dist/transformers.min.js';

ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/';
ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(8, navigator.hardwareConcurrency || 4) : 1;

const MODEL_ID = 'ResembleAI/chatterbox-turbo-ONNX';
const HF = `https://huggingface.co/${MODEL_ID}/resolve/main/`;
const LAME_URL = 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js';
const SAMPLE_RATE = 24000;
const START_SPEECH_TOKEN = 6561;
const STOP_SPEECH_TOKEN = 6562;
const SILENCE_TOKEN = 4299;

// ---------- cached download ----------
async function fetchCached(url, onProgress) {
  let cache = null;
  try { cache = await caches.open(CACHE_NAME); } catch {}
  if (cache) {
    const hit = await cache.match(url);
    if (hit) {
      const buf = new Uint8Array(await hit.arrayBuffer());
      onProgress(buf.byteLength, buf.byteLength, true);
      return buf;
    }
  }
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
  const total = +res.headers.get('content-length') || 0;
  const reader = res.body.getReader();
  let buf = total ? new Uint8Array(total) : null;
  const chunks = [];
  let loaded = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    if (buf && loaded + value.byteLength <= total) buf.set(value, loaded); else chunks.push(value);
    loaded += value.byteLength;
    onProgress(loaded, total || loaded, false);
  }
  if (!buf || loaded !== total) {
    const merged = new Uint8Array(loaded);
    let off = 0;
    if (buf) { merged.set(buf.subarray(0, Math.min(loaded, total))); off = Math.min(loaded, total); }
    for (const c of chunks) { merged.set(c, off); off += c.byteLength; }
    buf = merged;
  }
  if (cache) {
    try { await cache.put(url, new Response(buf, { headers: { 'content-type': 'application/octet-stream' } })); }
    catch (e) { log(`Could not cache ${url.split('/').pop()}: ${e.message}`); }
  }
  return buf;
}

const ensureModel = () => S.sessions && S.precision === S.quality ? Promise.resolve(true) : loadModel();
function loadModel() {

async function loadModelOnce() {
  const precision = S.quality;
  const backend = S.backend || 'webgpu';
  const P = PRECISIONS[precision];
  try { await navigator.storage?.persist?.(); } catch {}

  if (S.sessions) { for (const s of Object.values(S.sessions)) try { await s.release(); } catch {} }
  S.sessions = null;
  S.encoded.clear();

  try {
    setEngine('loading', 'Loading tokenizer…', 0);
    S.tokenizer ??= await AutoTokenizer.from_pretrained(MODEL_ID);

    const fileOf = (c) => `${c}${DTYPE_SUFFIX[P.dtypes[c]]}.onnx`;
    const files = COMPONENTS.flatMap((c) => [`onnx/${fileOf(c)}`, `onnx/${fileOf(c)}_data`]);
    const prog = Object.fromEntries(files.map((f) => [f, { loaded: 0, total: 0 }]));
    const t0 = performance.now();
    const bufs = await Promise.all(files.map((f) => fetchCached(HF + f, (loaded, total, cached) => {
      prog[f] = { loaded, total };
      let l = 0, t = 0;
      for (const p of Object.values(prog)) { l += p.loaded; t += p.total; }
      setEngine('loading', `Downloading ${fmtMB(l)}${t ? ' / ' + fmtMB(t) : ''}`, t ? 90 * l / t : 0);
    })));
    log(`Fetched ${files.length} files in ${((performance.now() - t0) / 1000).toFixed(1)} s`);

    const sessions = {};
    for (let i = 0; i < COMPONENTS.length; i++) {
      const comp = COMPONENTS[i];
      setEngine('loading', `Starting ${comp.replace('_', ' ')} (${i + 1}/${COMPONENTS.length})…`, 90 + 2.5 * i);
      await sleep0();
      sessions[comp] = await createSession(comp, fileOf(comp), bufs[i * 2], bufs[i * 2 + 1], backend);
      bufs[i * 2] = bufs[i * 2 + 1] = null; // let GC reclaim the download
    }

    refreshDownloaded();
    setEngine('ready', `Ready · ${precision} · ${backend === 'webgpu' ? 'WebGPU' : 'CPU'}`, 100);
    log(`Model ready (${precision}, ${backend}) in ${((performance.now() - t0) / 1000).toFixed(1)} s`);
    return true;
  } catch (e) {
    console.error(e);
    log('Load failed: ' + (e.message || e));
    setEngine('error', 'Load failed: ' + (e.message || e));
    toast(`The ${QUALITY_NAMES[precision]} model failed to load: ${e.message || e}`, true);
    refreshDownloaded();
    return false;
  }
}

async function createSession(comp, file, graph, data, backend) {
  const make = (ep) => {
    const opts = {
      executionProviders: [ep],
      graphOptimizationLevel: 'all',
      externalData: [{ path: `${file}_data`, data }],
    };
    if (ep === 'webgpu' && comp === 'language_model') {
      // Keep the KV cache on the GPU between decoding steps.
      const loc = { logits: 'cpu' };
      for (let l = 0; l < NUM_LAYERS; l++) { loc[`present.${l}.key`] = 'gpu-buffer'; loc[`present.${l}.value`] = 'gpu-buffer'; }
      opts.preferredOutputLocation = loc;
    }
    return ort.InferenceSession.create(graph, opts);
  };
  try {
    const s = await make(backend);
    log(`${comp}: ${backend}`);
    return s;
  } catch (e) {
    if (backend !== 'webgpu') throw e;
    log(`${comp}: WebGPU failed (${e.message}); trying WASM`);
    try { return await make('wasm'); } catch { throw e; }
  }
}

    const ch = audio.getChannelData(c);
    for (let i = 0; i < n; i++) out[i] += ch[i] / audio.numberOfChannels;

  if (audio.sampleRate !== SAMPLE_RATE) return resampleLinear(out, audio.sampleRate, SAMPLE_RATE);

}

}

}

let lamePromise = null;
function loadLame() {

async function encodeMp3(samples, sr = SAMPLE_RATE, kbps = 96) {
  const lame = await loadLame();
  const enc = new lame.Mp3Encoder(1, sr, kbps);
  const pcm = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) { const s = Math.max(-1, Math.min(1, samples[i])); pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff; }
  const parts = [];
  const block = 1152;
  for (let i = 0; i < pcm.length; i += block) {
    const out = enc.encodeBuffer(pcm.subarray(i, i + block));
    if (out.length) parts.push(new Uint8Array(out));
    if ((i / block) % 400 === 399) await sleep0(); // keep the page responsive on long takes
  }
  const end = enc.flush();
  if (end.length) parts.push(new Uint8Array(end));
  return new Blob(parts, { type: 'audio/mpeg' });
}

    ...BASE_VOICES.map((v) => ({ id: 'builtin:' + v.id, name: v.name, desc: v.desc, hue: v.hue, group: 'builtin' })),
    ...S.voices.map((v) => ({ id: 'voice:' + v.id, name: v.name, desc: `Saved · ${v.duration.toFixed(0)} s`, hue: v.hue, group: 'saved' })),
    ...C.clips.map((c) => ({ id: 'clip:' + c.id, name: c.name, desc: c.desc, hue: c.hue, group: 'clip' })),
  ];
}
async function loadBase(id) {
  if (C.seeds.has(id)) return C.seeds.get(id);
  const [kind, key] = id.split(':');
  let samples;
  if (kind === 'builtin') {
    const res = await fetch(window.DOPPEL_VOICES[key]); // embedded data: URL, see bottom of file
    samples = (await decodeToMono24k(await res.arrayBuffer())).samples;
    C.seeds.set(id, samples);
  } else if (kind === 'voice') {
    samples = S.voices.find((v) => v.id === key)?.samples;
  } else {
    samples = C.clips.find((c) => c.id === key)?.samples;
  }
  if (!samples) throw new Error('That voice is no longer available.');
  return samples;
}

// depth → formant factor f (vocal-tract size), pitch → F0 factor p.
// 1) EQ (+ anti-alias), 2) resample by f: shifts pitch and formants together,
// 3) TD-PSOLA: moves pitch by p/f (formants stay) and restores the duration.
// Pace is applied to the generated speech instead: the model ignores the reference's tempo.
async function shapeVoice(src, s) {
  const f = 2 ** (-s.depth / 100 * 0.25);
  const p = 2 ** (s.pitch / 12);
  let x = await filterVoice(src, s.bright, s.warmth, f);
  if (Math.abs(f - 1) > 1e-3) x = resampleBy(x, f);
  const pitchFactor = p / f, timeFactor = f, expr = s.expr / 100;
  if (Math.abs(pitchFactor - 1) > 1e-3 || Math.abs(timeFactor - 1) > 1e-3 || expr) x = psola(x, SAMPLE_RATE, pitchFactor, timeFactor, expr);
  if (s.room) x = await addRoom(x, s.room / 100);
  return normalizePeak(x === src ? Float32Array.from(x) : x, 0.9);
}

// Synthetic room: a short decaying-noise impulse response, mixed in wet.
async function addRoom(x, amount) {
  const decay = 0.25 + 0.9 * amount, tail = Math.ceil(SAMPLE_RATE * decay);
  const ctx = new OfflineAudioContext(1, x.length + tail, SAMPLE_RATE);
  const buf = ctx.createBuffer(1, x.length, SAMPLE_RATE); buf.copyToChannel(x, 0);
  const ir = ctx.createBuffer(1, tail, SAMPLE_RATE), d = ir.getChannelData(0);
  for (let i = 0; i < tail; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-6.9 * i / tail);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const conv = ctx.createConvolver(); conv.normalize = true; conv.buffer = ir;
  const dry = ctx.createGain(); dry.gain.value = 1 - 0.3 * amount;
  const wet = ctx.createGain(); wet.gain.value = 0.6 * amount;
  src.connect(dry).connect(ctx.destination);
  src.connect(conv).connect(wet).connect(ctx.destination);
  src.start();
  return (await ctx.startRendering()).getChannelData(0).slice(0, x.length);
}

async function filterVoice(x, brightness, warmth, f) {
  if (!brightness && !warmth && f <= 1) return x;
  const ctx = new OfflineAudioContext(1, x.length, SAMPLE_RATE);
  const buf = ctx.createBuffer(1, x.length, SAMPLE_RATE);
  buf.copyToChannel(x, 0);
  const src = ctx.createBufferSource(); src.buffer = buf;
  let node = src;
  const add = (type, freq, gain) => {
    const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = freq;
    if (gain != null) b.gain.value = gain;
    node.connect(b); node = b;
  };
  if (brightness) { add('highshelf', 3000, brightness); add('lowshelf', 200, -brightness / 2); }
  if (warmth) { add('peaking', 280, warmth); node.Q.value = 0.8; }
  if (f > 1) add('lowpass', 0.45 * SAMPLE_RATE / f); // resampling up would alias above Nyquist
  node.connect(ctx.destination);
  src.start();
  return (await ctx.startRendering()).getChannelData(0);
}

// Output is len/factor samples long; every frequency is multiplied by factor.
function resampleBy(x, factor) {
  const n = Math.floor((x.length - 1) / factor), y = new Float32Array(n);
  for (let i = 0; i < n; i++) { const p = i * factor, j = p | 0, t = p - j; y[i] = x[j] * (1 - t) + x[j + 1] * t; }
  return y;
}

// Per-frame pitch period in samples (0 = unvoiced), by normalized autocorrelation.
function trackPitch(x, sr) {
  const hop = Math.round(sr * 0.01), win = Math.round(sr * 0.02);
  const minLag = Math.floor(sr / 420), maxLag = Math.ceil(sr / 60);
  const nFrames = Math.max(0, Math.floor((x.length - win - maxLag) / hop));
  const periods = new Float32Array(nFrames);
  let g = 0; for (const v of x) g += v * v; g = Math.sqrt(g / x.length);
  const r = new Float32Array(maxLag + 1);
  for (let fr = 0; fr < nFrames; fr++) {
    const s = fr * hop;
    let e0 = 0; for (let i = 0; i < win; i++) e0 += x[s + i] * x[s + i];
    if (Math.sqrt(e0 / win) < g * 0.25) continue;
    let best = 0;
    for (let lag = minLag; lag <= maxLag; lag++) {
      let num = 0, e1 = 0;
      for (let i = 0; i < win; i++) { const b = x[s + i + lag]; num += x[s + i] * b; e1 += b * b; }
      r[lag] = num / Math.sqrt(e0 * e1 + 1e-12);
      if (r[lag] > best) best = r[lag];
    }
    if (best < 0.6) continue;
    // Take the first strong local peak to avoid octave-down errors.
    for (let lag = minLag + 1; lag < maxLag; lag++) {
      if (r[lag] >= 0.88 * best && r[lag] >= r[lag - 1] && r[lag] >= r[lag + 1]) { periods[fr] = lag; break; }
    }
  }
  // 5-frame median smoothing of voiced runs.
  const sm = Float32Array.from(periods);
  for (let i = 2; i < nFrames - 2; i++) {
    if (!periods[i]) continue;
    const w = [periods[i - 2], periods[i - 1], periods[i], periods[i + 1], periods[i + 2]].filter(Boolean).sort((a, b) => a - b);
    sm[i] = w[w.length >> 1];
  }
  return { periods: sm, hop };
}

// expr scales the intonation around the median pitch: -1 is monotone, +1 doubles the swings (in log pitch).
function psola(x, sr, pitchFactor, timeFactor, expr = 0) {
  const { periods, hop } = trackPitch(x, sr);
  const voicedP = Array.from(periods).filter(Boolean).sort((a, b) => a - b);
  const medT = voicedP.length ? voicedP[voicedP.length >> 1] : 0;
  const factorAt = (T) => !expr || !medT ? pitchFactor : pitchFactor * Math.min(2, Math.max(0.5, (medT / T) ** expr));
  const uvPeriod = Math.round(sr * 0.01);
  const periodAt = (t) => periods[Math.min(periods.length - 1, Math.max(0, Math.round(t / hop)))] || 0;

  // Analysis marks: one per pitch period in voiced speech, snapped to the waveform peak.
  const marks = [], per = [], voiced = [];
  let t = 0;
  while (t < x.length) {
    const T = periods.length ? periodAt(t) : 0;
    if (T) {
      const rad = Math.floor(T / 4);
      let best = t, bv = -1;
      for (let i = Math.max(0, t - rad); i <= Math.min(x.length - 1, t + rad); i++) { const v = Math.abs(x[i]); if (v > bv) { bv = v; best = i; } }
      if (marks.length && best <= marks[marks.length - 1] + T / 2) best = Math.round(t);
      marks.push(best); per.push(T); voiced.push(true); t = best + T;
    } else {
      marks.push(Math.round(t)); per.push(uvPeriod); voiced.push(false); t += uvPeriod;
    }
  }

  const maxT = Math.ceil(sr / 60) + 1;
  const outLen = Math.round(x.length * timeFactor);
  const y = new Float32Array(outLen + 2 * maxT), wsum = new Float32Array(outLen + 2 * maxT);
  let ts = 0, k = 0;
  while (ts < outLen) {
    const ta = ts / timeFactor;
    while (k < marks.length - 1 && Math.abs(marks[k + 1] - ta) <= Math.abs(marks[k] - ta)) k++;
    const m = marks[k], T = per[k];
    for (let i = -T; i < T; i++) {
      const si = m + i, di = Math.round(ts) + i + maxT;
      if (si < 0 || si >= x.length || di < 0 || di >= y.length) continue;
      const w = 0.5 - 0.5 * Math.cos(Math.PI * (i + T) / T);
      y[di] += x[si] * w; wsum[di] += w;
    }
    ts += voiced[k] ? T / factorAt(T) : T;
  }
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) out[i] = y[i + maxT] / Math.max(wsum[i + maxT], 0.1);
  return out;
}

function estimateHz(samples) {
  const { periods } = trackPitch(samples.subarray(0, SAMPLE_RATE * 8), SAMPLE_RATE);
  const voiced = Array.from(periods).filter(Boolean).sort((a, b) => a - b);
  return voiced.length ? Math.round(SAMPLE_RATE / voiced[voiced.length >> 1]) : 0;
}

// ---------- text chunking ----------
function chunkText(text, maxChars) {
  const clean = text.replace(/\s+/g, ' ').trim();
  if (!clean) return [];
  const sentences = clean.match(/[^.!?…]+(?:[.!?…]+["')\]]*|$)\s*/g) || [clean];
  const chunks = []; let cur = '';
  for (let s of sentences) {
    s = s.trim();
    if (!s) continue;
    // Very long sentences: split on commas/semicolons, then hard-wrap on spaces.
    const parts = s.length > maxChars ? s.split(/(?<=[,;:—])\s+/) : [s];
    for (let p of parts) {
      while (p.length > maxChars) {
        const cut = p.lastIndexOf(' ', maxChars) > 0 ? p.lastIndexOf(' ', maxChars) : maxChars;
        if (cur) { chunks.push(cur); cur = ''; }
        chunks.push(p.slice(0, cut).trim()); p = p.slice(cut).trim();
      }
      if (cur && (cur.length + 1 + p.length) > maxChars) { chunks.push(cur); cur = p; }
      else cur = cur ? cur + ' ' + p : p;
    }
  }
  if (cur) chunks.push(cur);
  return chunks;
}

// ---------- sampling ----------
let sortIdx = null;
function sampleToken(logits, seen, p) {
  for (const t of seen) { const s = logits[t]; logits[t] = s < 0 ? s * p.repPenalty : s / p.repPenalty; }
  const V = logits.length;
  if (p.temperature <= 0) {
    let best = 0; for (let i = 1; i < V; i++) if (logits[i] > logits[best]) best = i;
    return best;
  }
  for (let i = 0; i < V; i++) logits[i] /= p.temperature;
  if (!sortIdx || sortIdx.length !== V) sortIdx = new Uint32Array(V);
  for (let i = 0; i < V; i++) sortIdx[i] = i;
  sortIdx.sort((a, b) => logits[b] - logits[a]);
  const k = Math.max(1, Math.min(p.topK | 0 || V, V));
  const max = logits[sortIdx[0]];
  const probs = new Float64Array(k); let sum = 0;
  for (let i = 0; i < k; i++) { probs[i] = Math.exp(logits[sortIdx[i]] - max); sum += probs[i]; }
  let keep = k, cum = 0;
  for (let i = 0; i < k; i++) { cum += probs[i] / sum; if (cum >= p.topP) { keep = i + 1; break; } }
  let kept = 0; for (let i = 0; i < keep; i++) kept += probs[i];
  let r = Math.random() * kept;
  for (let i = 0; i < keep; i++) { r -= probs[i]; if (r <= 0) return sortIdx[i]; }
  return sortIdx[keep - 1];
}

// ---------- generation ----------
const SETTINGS_DEFAULTS = { temperature: 0.8, topP: 0.95, topK: 1000, repPenalty: 1.2, maxTokens: 1000, chunkChars: 280 };
const SET = { ...SETTINGS_DEFAULTS, ...ls.get('settings', {}) };
const i64 = (arr, dims) => new ort.Tensor('int64', BigInt64Array.from(arr, BigInt), dims);

// rt: { key, samples, pace, speed } — key identifies the voice for the encoder cache.
async function encodeVoice(rt) {
  if (S.encoded.has(rt.key)) return S.encoded.get(rt.key);
  const t0 = performance.now();
  const audio = new ort.Tensor('float32', rt.samples, [1, rt.samples.length]);
  const out = await S.sessions.speech_encoder.run({ audio_values: audio });
  const enc = {
    cond: out.audio_features,          // [1, m, 1024]
    promptTokens: out.audio_tokens,     // [1, p] int64
    spkEmb: out.speaker_embeddings,     // [1, 192]
    spkFeat: out.speaker_features,      // [1, f, 80]
  };
  S.encoded.set(rt.key, enc);
  log(`Voice encoded in ${((performance.now() - t0) / 1000).toFixed(2)} s (${out.audio_tokens.dims[1]} prompt tokens)`);
  return enc;
}

async function synthesizeChunk(text, voice, params, onToken) {
  const { embed_tokens: embed, language_model: lm, conditional_decoder: dec } = S.sessions;
  const kvType = kvTypeFor(S.precision);
  const ids = S.tokenizer.encode(text);

  // Prefix: [voice conditioning embeddings | text embeddings]
  const textEmb = (await embed.run({ input_ids: i64(ids, [1, ids.length]) })).inputs_embeds;
  const m = voice.cond.dims[1], n = ids.length;
  const prefix = new Float32Array((m + n) * HIDDEN);
  prefix.set(voice.cond.data); prefix.set(textEmb.data, m * HIDDEN);
  let inputsEmbeds = new ort.Tensor('float32', prefix, [1, m + n, HIDDEN]);
  let seqLen = m + n, total = m + n;

  let past = {};
  for (let l = 0; l < NUM_LAYERS; l++) for (const kv of ['key', 'value']) {
    past[`past_key_values.${l}.${kv}`] = new ort.Tensor(kvType, kvType === 'float16' ? new Uint16Array(0) : new Float32Array(0), [1, NUM_KV_HEADS, 0, HEAD_DIM]);
  }
  const disposePast = () => { for (const t of Object.values(past)) if (t.location === 'gpu-buffer') t.dispose(); };

  const tokens = [];
  const seen = new Set([START_SPEECH_TOKEN]);
  try {
    for (let step = 0; step < params.maxTokens; step++) {
      if (S.abort) break;
      const attention_mask = new ort.Tensor('int64', new BigInt64Array(total).fill(1n), [1, total]);
      const position_ids = i64(Array.from({ length: seqLen }, (_, k) => total - seqLen + k), [1, seqLen]);
      const out = await lm.run({ inputs_embeds: inputsEmbeds, attention_mask, position_ids, ...past });

      const V = out.logits.dims[2];
      const last = Float32Array.from(out.logits.data.subarray((seqLen - 1) * V, seqLen * V));
      const next = sampleToken(last, seen, params);

      disposePast();
      past = {};
      for (let l = 0; l < NUM_LAYERS; l++) for (const kv of ['key', 'value']) past[`past_key_values.${l}.${kv}`] = out[`present.${l}.${kv}`];

      if (next === STOP_SPEECH_TOKEN) break;
      tokens.push(next); seen.add(next);
      onToken(tokens.length);

      inputsEmbeds = (await embed.run({ input_ids: i64([next], [1, 1]) })).inputs_embeds;
      seqLen = 1; total += 1;
    }
  } finally {
    disposePast();
  }
  if (!tokens.length) return new Float32Array(0);

  const prompt = voice.promptTokens.data;
  const speech = new BigInt64Array(prompt.length + tokens.length + 3);
  speech.set(prompt);
  for (let i = 0; i < tokens.length; i++) speech[prompt.length + i] = BigInt(tokens[i]);
  speech.fill(BigInt(SILENCE_TOKEN), prompt.length + tokens.length);

  const wav = await dec.run({
    speech_tokens: new ort.Tensor('int64', speech, [1, speech.length]),
    speaker_embeddings: voice.spkEmb,
    speaker_features: voice.spkFeat,
  });
  return Float32Array.from(wav.waveform.data);
}

// Full text → audio for one voice. Returns null when nothing was produced.
async function synthesize(text, rt, onProgress) {
  const params = { ...SET, topP: SET.topP || 1, repPenalty: SET.repPenalty || 1, maxTokens: SET.maxTokens || 1000 };
  const chunks = chunkText(text, SET.chunkChars || 280);
  onProgress('Encoding voice…', 2);
  await sleep0();
  const voice = await encodeVoice(rt);
  const pieces = [];
  const gap = new Float32Array(Math.round(SAMPLE_RATE * 0.12));
  for (let c = 0; c < chunks.length && !S.abort; c++) {
    const tc = performance.now();
    const audio = await synthesizeChunk(chunks[c], voice, params, (nTok) => {
      const tps = nTok / ((performance.now() - tc) / 1000);
      const est = Math.min(0.95, nTok / Math.max(40, chunks[c].length * 1.1));
      onProgress(`${chunks.length > 1 ? `Part ${c + 1} of ${chunks.length} · ` : ''}${(nTok / 25).toFixed(1)} s generated · ${tps.toFixed(0)} tok/s`, 100 * (c + est) / chunks.length);
    });
    if (audio.length) { if (pieces.length) pieces.push(gap); pieces.push(audio); }
  }
  const len = pieces.reduce((a, p) => a + p.length, 0);
  if (!len) return null;
  let all = new Float32Array(len);
  let off = 0; for (const p of pieces) { all.set(p, off); off += p.length; }
  if (Math.abs(rt.pace - 1) > 1e-3) { onProgress('Adjusting pace…', 99); await sleep0(); all = psola(all, SAMPLE_RATE, 1, 1 / rt.pace); }
  if (Math.abs(rt.speed - 1) > 1e-3) all = resampleBy(all, rt.speed);
  return all;
}

const runtimeFor = (v) => ({ key: v.id, samples: v.samples, pace: v.pace || 1, speed: v.speed || 1 });

async function generateFor(voiceId, text) {
  if (S.gen) return;
  const v = S.voices.find((x) => x.id === voiceId);
  if (!v || !text.trim()) return;
  S.abort = false;
  S.gen = { voiceId, status: 'Starting…', pct: 0 };
  renderSidebar(); updateGenUI();
  const t0 = performance.now();
  let take = null;
  try {
    if (!(await ensureModel())) return;
    const audio = await synthesize(text, runtimeFor(v), (status, pct) => { S.gen.status = status; S.gen.pct = pct; updateGenUI(); });
    if (!audio) { if (!S.abort) toast('No audio was produced. Try rephrasing the text.', true); return; }
    const secs = (performance.now() - t0) / 1000, dur = audio.length / SAMPLE_RATE;
    take = { id: uid(), voiceId, text: text.trim(), created: Date.now(), samples: audio, duration: dur, engine: `${S.precision}/${S.backend}`, partial: S.abort };
    log(`Generated ${dur.toFixed(2)} s for "${v.name}" in ${secs.toFixed(2)} s`);
    try { await dbPut('takes', take); await pruneTakes(voiceId); }
    catch (e) { mem.takes.set(take.id, take); toast('Could not save this take to browser storage (' + e.message + ').', true); }
  } catch (e) {
    console.error(e);
    log('Generation failed: ' + (e.message || e));
    toast('Generation failed: ' + (e.message || e), true);
  } finally {
    S.gen = null;
    renderSidebar(); updateGenUI();
    if (shownVoice() === voiceId) await renderOutputs(voiceId, take?.id);
  }
}
async function pruneTakes(voiceId) {
  const takes = await dbTakes(voiceId);
  for (const t of takes.slice(MAX_TAKES_PER_VOICE)) await dbDel('takes', t.id);
}

// ---------- recording ----------
async function startRecording(onDone) {
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, channelCount: 1 } }); }
  catch (e) { toast('Microphone unavailable: ' + e.message, true); return null; }
  const chunks = [];
  const rec = new MediaRecorder(stream);
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    onDone(new Blob(chunks, { type: rec.mimeType }));
  };
  rec.start();
  return rec;
}

// ---------- shared player ----------
const P = { audio: new Audio(), takeId: null, urls: new Map(), onTick: null };
P.audio.addEventListener('timeupdate', () => P.onTick?.());
P.audio.addEventListener('ended', () => { P.onTick?.(); syncPlayButtons(); });
P.audio.addEventListener('pause', syncPlayButtons);
P.audio.addEventListener('play', syncPlayButtons);
function takeUrl(t) {
  if (!P.urls.has(t.id)) P.urls.set(t.id, URL.createObjectURL(encodeWav(t.samples, SAMPLE_RATE)));
  return P.urls.get(t.id);
}
function playTake(t) {
  if (P.takeId === t.id) { P.audio.paused ? P.audio.play() : P.audio.pause(); return; }
  P.takeId = t.id; P.audio.src = takeUrl(t); P.audio.play().catch(() => {});
}
function syncPlayButtons() {
  for (const b of document.querySelectorAll('[data-play]')) {
    const playing = b.dataset.play === P.takeId && !P.audio.paused;
    b.replaceChildren(icon(playing ? 'pause' : 'play'));
    b.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }
}

function drawWave(canvas, samples, progress = 0) {
  const dpr = devicePixelRatio || 1, w = canvas.clientWidth, hgt = canvas.clientHeight;
  if (!w) return;
  canvas.width = w * dpr; canvas.height = hgt * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const bars = Math.max(20, Math.floor(w / 4)), per = Math.floor(samples.length / bars) || 1;
  const cs = getComputedStyle(document.documentElement);
  const on = cs.getPropertyValue('--accent').trim(), off = cs.getPropertyValue('--muted').trim();
  let peak = 0.001;
  const vals = new Float32Array(bars);
  for (let b = 0; b < bars; b++) {
    let m = 0; for (let i = b * per, e = Math.min(samples.length, i + per); i < e; i += 4) m = Math.max(m, Math.abs(samples[i]));
    vals[b] = m; peak = Math.max(peak, m);
  }
  for (let b = 0; b < bars; b++) {
    const bh = Math.max(2, (vals[b] / peak) * (hgt - 6));
    const played = b / bars < progress;
    ctx.fillStyle = played ? on : off;
    ctx.globalAlpha = played ? 1 : 0.35;
    ctx.beginPath(); ctx.roundRect(b * 4, (hgt - bh) / 2, 2.5, bh, 1.25); ctx.fill();
  }
}

// ---------- routing ----------
function parseRoute() {
  const m = location.hash.match(/^#\/(voice|create)(?:\/([\w-]+))?/);
  if (m?.[1] === 'voice' && S.voices.some((v) => v.id === m[2])) return { view: 'voice', id: m[2] };
  if (m?.[1] === 'create') return { view: 'create', from: m[2] || null };
  return { view: 'home' };
}
// The page behind everything: the last voice you used (or your newest), else a "create a voice" tile.
function backgroundVoice() {
  const last = ls.get('lastVoice', null);
  return S.voices.find((v) => v.id === last) || S.voices[S.voices.length - 1] || null;
}
function render() {
  S.route = parseRoute();
  document.body.classList.remove('nav-open');
  const v = S.route.view === 'voice' ? S.voices.find((x) => x.id === S.route.id) : backgroundVoice();
  const same = shownVoice() === (v?.id || '');
  $('view').dataset.voice = v?.id || '';
  if (v) { ls.set('lastVoice', v.id); if (!same || S.route.view !== 'create') viewVoice(v); }
  else viewHome();
  const creating = S.route.view === 'create';
  $('createModal').hidden = !creating;

      h('button', { class: 'play sm', 'data-play': t.id, 'aria-label': 'Play', onclick: () => playTake(t) }, icon('play')),
      h('span', { class: 'txt', title: t.text }, t.text),
      h('span', { class: 'time' }, fmtTime(t.duration)),
      h('button', { class: 'btn sm ghost', title: 'Download MP3', onclick: (e) => downloadMp3(t, e.currentTarget) }, icon('download'), 'MP3'),
      h('button', { class: 'btn sm icon ghost', 'aria-label': 'Delete take', title: 'Delete take', onclick: () => deleteTake(t) }, icon('trash'))))) : null;
  box.replaceChildren(...[hero, list].filter(Boolean));
  P.onTick = tick;
  requestAnimationFrame(tick);
  P.ro?.disconnect();
  P.ro = new ResizeObserver(tick);
  P.ro.observe(canvas);
  syncPlayButtons();
  if (playId === latest.id) playTake(latest);
}
function takeFilename(t, ext) {
  const v = S.voices.find((x) => x.id === t.voiceId);
  const words = t.text.replace(/\[[^\]]*\]/g, '').split(/\s+/).filter(Boolean).slice(0, 5).join(' ');
  return `${slug(v?.name)}-${slug(words)}.${ext}`;
}
async function downloadMp3(t, btn) {
  const old = btn?.innerHTML;
  if (btn) { btn.disabled = true; btn.textContent = 'Encoding…'; }
  try { saveBlob(await encodeMp3(t.samples), takeFilename(t, 'mp3')); }
  catch (e) { toast('MP3 export failed: ' + e.message + '. Try WAV instead.', true); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = old; } }
}
async function deleteTake(t) {
  if (P.takeId === t.id) { P.audio.pause(); P.takeId = null; }
  if (P.urls.has(t.id)) { URL.revokeObjectURL(P.urls.get(t.id)); P.urls.delete(t.id); }
  await dbDel('takes', t.id); mem.takes.delete(t.id);
  renderOutputs(t.voiceId);
}

async function renameVoice(v, name) {
  name = name.trim().slice(0, 40);
  if (!name || name === v.name) { render(); return; }
  v.name = name;
  try { await dbPut('voices', v); } catch (e) { toast('Could not save the new name: ' + e.message, true); }
  renderSidebar();
}
async function deleteVoice(v) {
  if (S.gen?.voiceId === v.id) { toast('Wait for the current generation to finish first.'); return; }
  if (!confirm(`Delete "${v.name}" and all of its takes? This can't be undone.`)) return;
  for (const t of await dbTakes(v.id)) await dbDel('takes', t.id);
  await dbDel('voices', v.id);
  S.voices = S.voices.filter((x) => x.id !== v.id);
  S.encoded.delete(v.id);
  const d = ls.get('drafts', {}); delete d[v.id]; ls.set('drafts', d);
  toast(`Deleted "${v.name}"`);
  const next = S.voices[S.voices.length - 1];
  go(next ? `#/voice/${next.id}` : '#/');
}

// ---------- voice files (.doppel.json) ----------
// Holds the (already shaped) reference audio as WAV plus the output pace and speed-up.
async function exportVoice(v) {
  const audio = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result); r.onerror = () => reject(r.error);
    r.readAsDataURL(encodeWav(v.samples, SAMPLE_RATE));
  });
  const data = { format: 'doppel-voice', version: 1, name: v.name, notes: v.notes || '', pace: v.pace, speed: v.speed || 1, hue: v.hue, sampleRate: SAMPLE_RATE, created: new Date(v.created).toISOString(), audio };
  saveBlob(new Blob([JSON.stringify(data)], { type: 'application/json' }), `${slug(v.name)}.doppel.json`);
}

// .doppel.json → saved voice directly; plain audio → a clip in the create view to shape and name.
async function importFile(file) {
  try {
    if (/\.json$/i.test(file.name || '') || file.type === 'application/json') {
      const data = JSON.parse(await file.text());
      if (data.format !== 'doppel-voice' || !/^data:audio\//.test(data.audio || '')) throw new Error('This is not a Doppel voice file.');
      const { samples } = await decodeToMono24k(await (await fetch(data.audio)).arrayBuffer());
      if (samples.length < SAMPLE_RATE * 2) throw new Error('The voice clip is shorter than 2 seconds.');
      const rec = {
        id: uid(), name: String(data.name || 'Imported voice').slice(0, 40), created: Date.now(),
        hue: Number.isFinite(data.hue) ? data.hue : Math.floor(Math.random() * 360),
        pace: Math.min(3, Math.max(0.8, Number(data.pace) || 1)), speed: Math.min(2, Math.max(1, Number(data.speed) || 1)), notes: String(data.notes || 'imported').slice(0, 200),
        samples, duration: samples.length / SAMPLE_RATE,
      };
      await dbPut('voices', rec);
      S.voices.push(rec);
      toast(`Imported "${rec.name}"`);
      go(`#/voice/${rec.id}`);
      return;
    }
    const { samples, trimmed } = await decodeToMono24k(await file.arrayBuffer());
    if (samples.length < SAMPLE_RATE * 2) throw new Error('Clip is shorter than 2 seconds.');
    normalizePeak(samples, 0.9, 0.5);
    const hz = estimateHz(samples);
    const id = String(++C.clipCount);
    const name = (file.name || 'Clip').replace(/\.[^.]+$/, '').slice(0, 40) || 'Clip';
    C.clips.push({ id, name, samples, hue: (C.clipCount * 67 + 40) % 360, desc: `${(samples.length / SAMPLE_RATE).toFixed(0)} s${hz ? ` · ${hz} Hz` : ''}${trimmed ? ' · trimmed' : ''}` });
    if (C.mode !== 'clone') setMode('clone');
    C.base = 'clip:' + id;
    if (S.route.view !== 'create') go('#/create'); else viewCreate(null);
    log(`Added clip "${name}" (${(samples.length / SAMPLE_RATE).toFixed(1)} s)`);
  } catch (e) {
    log('Import failed: ' + e.message);
    toast('Could not import that file: ' + e.message, true);
  }
}

// ---------- wiring ----------
$('importBtn').onclick = () => $('importInput').click();
$('importInput').onchange = (e) => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = ''; };
$('menuBtn').onclick = () => document.body.classList.add('nav-open');
$('scrim').onclick = () => document.body.classList.remove('nav-open');
$('newVoiceBtn').onclick = (e) => { e.preventDefault(); go('#/create'); };
$('modalClose').onclick = closeCreate;
$('modalScrim').onclick = closeCreate;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.route.view === 'create' && !document.querySelector('details.settings[open]')) closeCreate(); });
window.addEventListener('hashchange', render);
addEventListener('resize', () => P.onTick?.());
// Close the settings popover when clicking elsewhere.
document.addEventListener('click', (e) => { for (const d of document.querySelectorAll('details.settings[open]')) if (!d.contains(e.target)) d.open = false; });

if (!window.isSecureContext) log('Warning: not a secure context. Serve this page from https:// or http://localhost for WebGPU, caching and the microphone.');
detectDevice();
(async () => {
  try { S.voices = (await dbAll('voices')).sort((a, b) => a.created - b.created); }
  catch (e) { log('Could not read saved voices: ' + e.message); }
  render();
})();
</script>
